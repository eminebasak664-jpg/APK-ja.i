
name: Ja.i Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "Ja.i_Android_0.1.1_Duzeltilmis_GitHub_APK.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o Ja.i_Android_0.1.1_Duzeltilmis_GitHub_APK.zip -d extracted
          test -f extracted/Ja.i/gradlew
          test -f extracted/Ja.i/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build debug APK
        working-directory: extracted/Ja.i
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jai-debug-apk
          path: extracted/Ja.i/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
